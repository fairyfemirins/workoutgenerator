<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .workout-card {
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Workout Generator</h1>
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title">Generate Workout</h3>
                        <form id="workout-form">
                            <div class="mb-3">
                                <label for="goal" class="form-label">Goal</label>
                                <select class="form-select" id="goal">
                                    <option value="strength">Strength</option>
                                    <option value="endurance">Endurance</option>
                                    <option value="flexibility">Flexibility</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="equipment" class="form-label">Equipment</label>
                                <select class="form-select" id="equipment">
                                    <option value="bodyweight">Bodyweight</option>
                                    <option value="dumbbells">Dumbbells</option>
                                    <option value="resistance_bands">Resistance Bands</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Generate Workout</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title">Your Workout</h3>
                        <div id="workout"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('workout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const goal = document.getElementById('goal').value;
            const equipment = document.getElementById('equipment').value;
            
            // Fetch generated workout
            const response = await fetch('/generate_workout', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    goal: goal,
                    equipment: equipment
                })
            });
            const data = await response.json();
            displayWorkout(data.workout, data.goal, data.equipment);
        });

        function displayWorkout(workout, goal, equipment) {
            const workoutDiv = document.getElementById('workout');
            workoutDiv.innerHTML = '';
            
            if (workout.length === 0) {
                workoutDiv.innerHTML = '<p>No workout found. Try adjusting your filters.</p>';
                return;
            }
            
            const goalText = goal.charAt(0).toUpperCase() + goal.slice(1);
            const equipmentText = equipment.replace('_', ' ').charAt(0).toUpperCase() + equipment.replace('_', ' ').slice(1);
            
            const workoutHeader = document.createElement('h4');
            workoutHeader.innerHTML = `${goalText} Workout (${equipmentText})`;
            workoutDiv.appendChild(workoutHeader);
            
            workout.forEach(item => {
                const workoutCard = document.createElement('div');
                workoutCard.className = 'workout-card';
                workoutCard.innerHTML = `
                    <h5>${item.exercise}</h5>
                    <p><strong>Sets:</strong> ${item.sets}</p>
                    <p><strong>${item.reps ? 'Reps' : 'Duration'}:</strong> ${item.reps || item.duration}</p>
                `;
                workoutDiv.appendChild(workoutCard);
            });
        }
    </script>
</body>
</html>
